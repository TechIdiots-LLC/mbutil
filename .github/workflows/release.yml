name: 'Build, Publish Docker and GitHub Release'

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  DOCKER_IMAGE_NAME: techidiotsllc/pmtiles-mbtiles-util

jobs:
  release-check:
    name: Check if version is already released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version and check GitHub releases
        id: check
        run: |
          VERSION=$(grep -oP "version='\K[^']+" setup.py)
          if echo "$VERSION" | grep -qP "a[0-9]+|b[0-9]+|rc[0-9]+|\.dev"; then
            RELEASE_TYPE="prerelease"
          else
            RELEASE_TYPE="regular"
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            PUBLISHED="true"
          else
            PUBLISHED="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"
          echo "RELEASE_TYPE: $RELEASE_TYPE"
          echo "PUBLISHED: $PUBLISHED"

    outputs:
      published: ${{ steps.check.outputs.published }}
      version: ${{ steps.check.outputs.version }}
      release_type: ${{ steps.check.outputs.release_type }}

  build_python:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: release-check
    if: ${{ needs.release-check.outputs.published == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: |
          twine check dist/*
          ls -la dist/

      # The sdist and wheel must carry the version the tag will use, or the
      # GitHub release and PyPI end up describing different builds. Compared as
      # parsed versions, because a `0.4.6rc1` bump normalises differently in a
      # filename than in setup.py.
      - name: Verify built version matches
        run: |
          python - <<'EOF'
          import pathlib, sys
          from packaging.version import Version
          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          expected = Version("${{ needs.release-check.outputs.version }}")
          files = sorted(pathlib.Path("dist").iterdir())
          if not files:
              sys.exit("::error::dist/ is empty")

          failed = False
          for f in files:
              if f.name.endswith(".whl"):
                  _, found, _, _ = parse_wheel_filename(f.name)
              elif f.name.endswith(".tar.gz"):
                  _, found = parse_sdist_filename(f.name)
              else:
                  continue
              status = "ok" if found == expected else "MISMATCH"
              print(f"  {f.name}: {found} ({status})")
              if found != expected:
                  failed = True

          if failed:
              sys.exit(f"::error::expected {expected}, see mismatches above")
          print(f"All artifacts carry {expected}")
          EOF

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7

  build_docker_images:
    name: Build Docker ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runs-on }}
    needs: release-check
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push ${{ matrix.arch }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:v${{ needs.release-check.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [release-check, build_python, build_docker_images]
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release
    permissions:
      contents: write
      # Required for PyPI Trusted Publishing.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release tags
        id: prepare_release
        run: |
          if [[ "${{ needs.release-check.outputs.release_type }}" == 'regular' ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create and push multi-arch Docker manifest
        run: |
          PACKAGE_VERSION="${{ needs.release-check.outputs.version }}"

          docker buildx imagetools create \
            --tag "${{ env.DOCKER_IMAGE_NAME }}:${{ steps.prepare_release.outputs.tag }}" \
            --tag "${{ env.DOCKER_IMAGE_NAME }}:v${PACKAGE_VERSION}" \
            "${{ env.DOCKER_IMAGE_NAME }}:v${PACKAGE_VERSION}-amd64" \
            "${{ env.DOCKER_IMAGE_NAME }}:v${PACKAGE_VERSION}-arm64"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.release-check.outputs.version }}"
          awk -v ver="## $VERSION" 'BEGIN{p=0} $0==ver{p=1; next} /^## / && p==1{exit} p==1{print}' CHANGELOG.md > changelog_for_version.md
          cat changelog_for_version.md

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ needs.release-check.outputs.version }}
          name: v${{ needs.release-check.outputs.version }}
          bodyFile: changelog_for_version.md
          artifacts: "dist/*"
          prerelease: ${{ steps.prepare_release.outputs.prerelease }}
          allowUpdates: true
          draft: false

      # Trusted Publishing: no stored token. PyPI verifies this workflow's OIDC
      # identity against a publisher configured at
      # https://pypi.org/manage/account/publishing/ -- which must name this
      # repository, `release.yml`, and the `release` environment set on this
      # job. All three have to match or the upload is rejected.
      #
      # pmtiles-mbtiles-util does not exist on PyPI yet, so it needs to be
      # added there as a *pending* publisher; the project is created by the
      # first upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run after a partial failure should not fall over on the file
          # that already landed.
          skip-existing: true
